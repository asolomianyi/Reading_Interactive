p1:{title:"Chapter 1: The Blue Door",
b:[
"Mia arrived in the small town of Port Selby on a grey Friday afternoon. She was staying with her grandfather for the weekend. He had lived in the old house by the sea for forty years, and Mia had always loved visiting him. When she opened the door, the house smelled of tea and old books.",
"Port Selby was not a big place. It had one main street, a bakery, a post office and a harbour with about twenty fishing boats. Every morning the fishermen left before sunrise, and every evening they came back with boxes of silver fish. Mia’s grandfather didn’t fish any more, but he knew everybody in town. People often stopped him in the street to ask about the weather, because he could read the sky better than any radio. Mia put her suitcase down and looked around the hall. Nothing had changed. The same clock was ticking on the wall, the same blue umbrella was standing in the corner, and the same photos of ships were hanging next to the stairs. She felt happy and a little sleepy after the long bus journey from the city.",
{q:[{t:"“Every morning the fishermen ___ before sunrise,” her grandfather always says.",o:["leaves","leave","are leaving","left"],a:1,w:"This is a regular habit, so we use Present Simple. “Fishermen” is plural, so there is no -s."}]},
{q:[{t:"While Mia ___ her bag in the hall, she heard a strange noise upstairs.",o:["unpacked","was unpacking","has unpacked","unpacks"],a:1,w:"A longer action was in progress in the past and a short action (heard) interrupted it. We use Past Continuous for the longer action."}]},
"“Grandpa?” she called. Nobody answered. On the kitchen table there was a note: “Gone to the harbour. Back at six. Don’t touch the blue door!” Mia smiled. Her grandfather loved mysteries, and he often left funny notes. But the blue door was new to her. She walked along the corridor and found it at the end, small and painted bright blue. Next to it, an old brown coat was hanging on a hook. She put her hand in the pocket and found a heavy silver key.",
{q:[{t:"“I ___ this key before,” she whispered.",o:["never saw","have never seen","never see","am never seeing"],a:1,w:"We talk about life experience up to now, with no finished time. We use Present Perfect: have + past participle."},
{t:"“If I ___ the door, Grandpa will be angry,” she thought.",o:["will open","open","opened","would open"],a:1,w:"This is the first conditional: if + Present Simple, will + verb. We never use “will” after “if”."}]},
"Mia held the key in her hand. It was cold and heavier than it looked, and on one side someone had carved a tiny picture of a lighthouse. She turned it over slowly. Mia was not a brave person, but she was very curious, and curiosity usually won. In her bag she had a small torch, a notebook and half a chocolate bar. She sat down on the floor and thought about her choices. Her grandfather had never told her a lie, she knew that. So why did he hide this door? What was behind it? She remembered something he taught her when she was little: “If you heat water to 100 degrees, it boils.” He liked to say that real facts never change, and a good detective looks for facts, not for ideas.",
{q:[{t:"“If you heat water to 100 degrees, it ___.”",o:["boils","will boil","would boil","boiled"],a:0,w:"This is a general truth that is always true, so we use the zero conditional: if + Present Simple, Present Simple."}]},
"“Fact one,” she whispered, “there is a key. Fact two, there is a door.” She stood up and looked down the dark corridor. Somewhere in the house, an old floorboard creaked. Mia held her breath for a few seconds, but nothing else happened. “OK,” she decided. “It’s too late and I’m too tired for this.”",
{q:[{t:"“Tomorrow I ___ Grandpa everything,” she decided on the spot.",o:["ask","am asking","will ask","have asked"],a:2,w:"She makes a decision at the moment of speaking, so we use Future Simple (will + verb)."}]},
"Just then, the phone rang in the kitchen. Mia ran back and picked it up. “Mia, it’s me,” said her grandfather. His voice sounded nervous. “Please listen carefully. Somebody has been asking questions about the key in my coat. A tall man in a green hat. If you see him, don’t open the door.” Mia looked out of the window. A tall man in a green hat was standing at the garden gate."
],

p2a:{title:"Chapter 2A: The Round Room",
b:[
"Mia turned the key. The door opened with a soft click. Behind it there was a narrow staircase going up. At the top she found a small round room full of maps, brass instruments and a huge old lamp. It was the inside of the lighthouse tower, and it was connected to the house! On the wall hung a photo of her grandfather as a young man, standing next to a woman Mia didn’t know.",
"She took the photo from the wall. On the back, in blue ink, someone had written: “Anna and Tom, summer, the year of the great storm.” Mia’s grandfather was called Tom. So the woman was Anna, but Mia had never heard that name in the family. She put the photo down and walked slowly round the room. The maps showed the coast, the rocks and the deep water under the cliffs. A red line went from the harbour to a small island, and next to the island someone had drawn a cross. Mia loved old maps, and she always enjoyed ___ at them for hours.",
{q:[{t:"Mia always enjoyed ___ at old maps for hours.",o:["look","to look","looking","looked"],a:2,w:"After the verb “enjoy” we use the gerund (verb + -ing)."}]},
"Her heart was beating fast. Was it a treasure map? Or only a game her grandfather had invented for her? She took out her notebook and carefully copied the red line, the island and the cross.",
{q:[{t:"There were fresh footprints on the dusty floor, so somebody ___ the room before her.",o:["had entered","entered","was entering","enters"],a:0,w:"The entering happened before another past moment (Mia’s arrival). We use Past Perfect: had + past participle."}]},
"Then she heard the front door open. Heavy steps began to climb the stairs. “If I hid behind the big lamp, he wouldn’t see me,” Mia thought.",
{q:[{t:"“If I ___ behind the big lamp, he wouldn’t see me.”",o:["hide","hid","would hide","had hidden"],a:1,w:"This is the second conditional (imaginary situation): if + Past Simple, would + verb."}]},
"A voice said quietly, “Mia, don’t be afraid. I knew your grandmother.” The tall man took off his green hat."],s:[[{t:"Mia found a staircase behind the blue door.",a:1,w:"Correct: a narrow staircase went up behind the door."},{t:"The round room was in the cellar.",a:0,w:"It was at the top of the staircase, inside the lighthouse tower."},{t:"The photo showed Mia’s grandfather with a woman she didn’t know.",a:1,w:"Correct: he was standing next to a woman Mia didn’t know."},{t:"On the back of the photo, the names were Anna and Tom.",a:1,w:"Correct: “Anna and Tom, summer, the year of the great storm.”"},{t:"The red line on the map went from the harbour to a mountain.",a:0,w:"It went to a small island, not to a mountain."}],[{t:"The room contained maps, brass instruments and a huge lamp.",a:1,w:"Correct: these are the things Mia saw in the round room."},{t:"Mia often heard the name Anna in her family.",a:0,w:"She had never heard that name in the family."},{t:"Mia copied the map into her notebook.",a:1,w:"Correct: she copied the red line, the island and the cross."},{t:"Mia hid behind the lamp.",a:0,w:"She only thought about hiding (“If I hid…”). She did not do it."},{t:"The tall man said he knew Mia’s grandmother.",a:1,w:"Correct: “I knew your grandmother.”"}]],c:[{l:"Trust the tall man and listen to him.",n:"p3",g:"trust"},{l:"Run down the stairs and escape.",n:"p3",g:"run"}]},
p2b:{title:"Chapter 2B: The Harbour",
b:[
"Mia ran out of the back door and down the narrow path to the harbour. The sea was loud and the wind was cold. Her grandfather was waiting beside his small blue boat, and he looked tired.",
"The small harbour was almost empty. Most boats were already at sea, and only a few gulls were walking along the wall. Mia noticed that her grandfather’s hands were shaking a little. He was holding a rope, but he was not tying anything; he just kept pulling it through his fingers. Behind him, on the deck, there was an old wooden box with a rusty lock. “Is that why you wrote the note?” Mia asked. He looked at the sea for a long time. “Quick, the sky is dark and the wind ___ stronger,” he finally said.",
{q:[{t:"“Quick, the wind ___ stronger right now,” he said.",o:["gets","is getting","got","will have got"],a:1,w:"The action is happening at this moment, so we use Present Continuous (am/is/are + -ing)."}]},
"“Sit down, Mia,” he added. “This story is long, and I am not sure where to begin.”",
{q:[{t:"“I ___ for you for an hour!” he said.",o:["wait","have been waiting","was waiting","am waiting"],a:1,w:"The action started in the past and continues up to now, and we give its duration (for an hour). We use Present Perfect Continuous."}]},
"“Grandpa, who is that man?” asked Mia. He sighed. “His name is Mr Crane. He wants the key because of something hidden in the lighthouse. I decided to tell you the truth.”",
{q:[{t:"“I decided ___ you the truth.”",o:["telling","to tell","tell","told"],a:1,w:"After the verb “decide” we use the to-infinitive: decide to do something."}]},
"Mia took a deep breath. “Then tell me everything,” she said."],s:[[{t:"Mia reached the harbour through the back door.",a:1,w:"Correct: she ran out of the back door and down the path."},{t:"Her grandfather was waiting beside a red boat.",a:0,w:"The boat was small and blue."},{t:"The tall man’s name was Mr Crane.",a:1,w:"Correct: her grandfather said his name was Mr Crane."},{t:"Her grandfather said he had been waiting for two hours.",a:0,w:"He said “for an hour”."},{t:"There was an old wooden box on the deck.",a:1,w:"Correct: it had a rusty lock."}],[{t:"The harbour was full of boats.",a:0,w:"It was almost empty because most boats were already at sea."},{t:"Her grandfather’s hands were shaking a little.",a:1,w:"Correct: Mia noticed this."},{t:"Mr Crane wants the key because of something hidden in the lighthouse.",a:1,w:"Correct: this is what Grandpa said."},{t:"Mia said she didn’t want to know the truth.",a:0,w:"She said: “Then tell me everything.”"},{t:"Her grandfather decided to tell her the truth.",a:1,w:"Correct: “I decided to tell you the truth.”"}]],c:[{l:"Open the old wooden box.",n:"p3",g:"box"},{l:"Ask about the woman called Anna first.",n:"p3",g:"anna"}]},
p3:{title:"Chapter 3: The Lamp",b:[
{o:"trust",t:"Mia stayed where she was. The tall man sat down on an old chair and held his hat on his knees. “My name is Crane,” he said. “Your grandmother Anna was my sister.” Mia’s grandfather appeared at the top of the stairs, out of breath. “It’s true,” he said. “I’m sorry I didn’t tell you before.”"},
{o:"run",t:"Mia ran down the stairs two at a time, but at the bottom her grandfather was standing in the doorway. “Stop, Mia!” he said. “Mr Crane isn’t our enemy. Come back up. It’s time to tell you everything.” Slowly, she followed him to the round room, where the tall man was waiting."},
{o:"box",t:"Mia opened the old wooden box. Inside there was no gold, only a bundle of letters tied with a blue ribbon. The first one began: “My dear Tom…”. Her grandfather closed his eyes. “Your grandmother wrote those,” he said. Then he took the box and led her up to the lighthouse, where Mr Crane was already waiting."},
{o:"anna",t:"“First tell me about Anna,” said Mia. Her grandfather sat down heavily on the wooden box. “Anna was your grandmother,” he said. “She disappeared forty years ago, during the great storm. People said the sea took her.” Then he led her up to the lighthouse, where Mr Crane was waiting."},
"That evening the three of them stood in the round room at the top of the lighthouse. The huge lamp was dark and cold. “Forty years ago, on the night of the great storm,” began Mr Crane, “the lamp stopped working, and a fishing boat hit the rocks. Anna was trying to repair the lamp when the storm came. She stayed too long.” He looked at the floor. “If she had left earlier, she would have been safe.”",
{q:[{t:"“If she ___ earlier, she would have been safe.”",o:["left","had left","would leave","has left"],a:1,w:"This is the third conditional (an unreal past situation): if + Past Perfect, would have + past participle."}]},
"Mia’s grandfather took the silver key and walked slowly to the lamp. Under the glass there was a tiny lock. His hand was trembling. “For forty years I have avoided ___ at this lamp,” he said quietly. “Every night I have turned my face away.”",
{q:[{t:"“For forty years I have avoided ___ at this lamp.”",o:["to look","looking","look","looked"],a:1,w:"After the verb “avoid” we use the gerund (verb + -ing)."}]},
"He pushed the key into the lock and turned it. The lock opened with a soft click. Inside the lamp there was a small metal tube, and inside the tube there was a yellow paper. Mia unrolled it carefully. It was a letter, and it said: “Tom, the island is safe. Look under the lighthouse. – A.” Nobody spoke. Outside, the sea was getting louder.",
{q:[{t:"The lock ___ with a soft click.",o:["opens","opened","has opened","was opening"],a:1,w:"This is a finished action in the past, so we use Past Simple."}]},
"Mia looked at the faces of the two men. She had a hundred questions, but only one of them really mattered."],s:[[{t:"Mr Crane said the lamp stopped working forty years ago.",a:1,w:"Correct: it stopped working on the night of the great storm."},{t:"A fishing boat hit the rocks.",a:1,w:"Correct: this happened when the lamp was dark."},{t:"Anna had left the lighthouse before the storm came.",a:0,w:"She stayed too long, so she was still there."},{t:"The key opened a tiny lock under the glass of the lamp.",a:1,w:"Correct: Mia’s grandfather opened it with the silver key."},{t:"The letter was signed by Tom.",a:0,w:"It was signed “A.”, and it was written to Tom."}],[{t:"Mr Crane said Anna was trying to repair the lamp.",a:1,w:"Correct: she was repairing it when the storm came."},{t:"Mia’s grandfather had often looked at the lamp in the last forty years.",a:0,w:"He had avoided looking at it for forty years."},{t:"Inside the lamp there was a metal tube with a yellow paper.",a:1,w:"Correct: Mia unrolled the paper carefully."},{t:"The letter said that the island was dangerous.",a:0,w:"It said the island was safe."},{t:"The letter told Tom to look under the lighthouse.",a:1,w:"Correct: “Look under the lighthouse.”"}]],c:[{l:"Go down under the lighthouse.",n:"p4",g:"under"},{l:"Take the boat to the island.",n:"p4",g:"island"}]},
p4:{title:"Chapter 4: The Tin Box",b:[
{o:"under",t:"Mr Crane pushed the old lamp table aside and found a trapdoor in the floor. They climbed down a ladder into a cold stone room that smelled of salt and smoke. In the light of Mia’s torch they saw a small desk, a chair and a rusty tin box."},
{o:"island",t:"At dawn they took the little blue boat to the island. The sea was calm and the sky was pink. When they reached the beach, Mr Crane pointed to a path between the rocks, where a stone hut stood among the grass. Inside there was a small desk, a chair and a rusty tin box."},
"“Before we open it,” said Mia, “I need some answers. Why did you ask questions about the key in town? You frightened my grandfather.” Mr Crane looked ashamed. “It’s simple,” he said. “I ___ Anna for forty years. Three months ago I saw a newspaper photo of Tom with the silver key, and I came to Port Selby. But I was too nervous to knock on his door, so I only asked people about him. I should have introduced myself.”",
{q:[{t:"“I ___ Anna for forty years,” said Mr Crane.",o:["look for","have been looking for","am looking for","looked for"],a:1,w:"The action started forty years ago and continues now, with a period of time (for forty years). We use Present Perfect Continuous."}]},
"Mia’s grandfather nodded slowly. “And I thought Mr Crane blamed me for the storm,” he said. “That is why I was afraid.” Mia turned to him. “And why have I never heard the name Anna?” He took a deep breath. “Because it hurt too much to talk about her. When she disappeared, your mother was only a baby. I told everybody that Anna had left town. I knew that if I talked about her every day, I ___ sad all the time. So I locked all my memories in this lighthouse.”",
{q:[{t:"“I knew that if I talked about her every day, I ___ sad all the time.”",o:["will be","would be","would have been","am"],a:1,w:"This is the second conditional (an unreal or imagined situation): if + Past Simple, would + verb."}]},
"Mia opened the tin box. Inside there was a small notebook, a brass compass and an old photo of a baby. She turned the photo over. On the back, in neat handwriting, somebody had written: “For Tom. Our Clara, three months old.” “That’s my mum,” Mia whispered. Nobody said a word. Then she opened the notebook. On the last page there were only a few lines: “If anything happens to me, remember that the real treasure is not gold. It is…” The rest of the page was torn off. Mia decided ___ the missing page.",
{q:[{t:"Mia decided ___ the missing page.",o:["finding","to find","find","found"],a:1,w:"After the verb “decide” we use the to-infinitive."}]},
"She looked at the compass in her hand. Its needle was not pointing north. It was pointing at the wall."],s:[[{t:"Mr Crane came to Port Selby three months ago.",a:1,w:"Correct: he saw a newspaper photo and then came to town."},{t:"Mr Crane knocked on Tom’s door immediately.",a:0,w:"He was too nervous to knock, so he only asked people about Tom."},{t:"The tin box contained a notebook, a compass and a photo.",a:1,w:"Correct: these were the three things Mia found."},{t:"The baby in the photo was called Clara.",a:1,w:"Correct: “Our Clara, three months old.”"},{t:"The compass needle pointed north.",a:0,w:"It pointed at the wall, not north."}],[{t:"Mr Crane found a photo of Tom in a newspaper.",a:1,w:"Correct: Tom was holding the silver key in the photo."},{t:"Tom told everybody that Anna had died.",a:0,w:"He told everybody that she had left town."},{t:"Mia’s mother was a baby when Anna disappeared.",a:1,w:"Correct: Clara was only three months old."},{t:"The last page of the notebook was complete.",a:0,w:"The rest of the page was torn off."},{t:"Anna wrote that the real treasure was gold.",a:0,w:"She wrote that the real treasure was not gold."}]],c:[{l:"Follow the compass needle to the wall.",n:"p5",g:"wall"},{l:"Read the notebook again to look for clues.",n:"p5",g:"read"}]},
p5:{title:"Chapter 5: Behind the Wall",b:[
{o:"wall",t:"Mia walked slowly in the direction of the needle until she was standing in front of the wall. The stones looked old and normal, but when she pressed one of them, it moved inwards with a dry scraping noise."},
{o:"read",t:"Mia turned back to the beginning of the notebook. On the first page there was a drawing of a compass, and under it Anna had written: “North is a lie. Follow the needle.” Mia smiled, held the compass up and walked to the wall. She pressed the stone that the needle was pointing at, and it moved inwards with a dry scraping noise."},
"A small door opened in the wall. Behind it there was a narrow space, no bigger than a cupboard. Inside, wrapped in an oilskin cloth, lay a thick black logbook, a small brass key and an envelope. On the envelope there was one word: “Tom”. Mia’s grandfather took it with shaking hands. “I ___ her handwriting for forty years,” he said. “But I have never forgotten it.”",
{q:[{t:"“I ___ her handwriting for forty years.”",o:["didn’t see","haven’t seen","don’t see","wasn’t seeing"],a:1,w:"The period lasts from the past until now (for forty years), so we use Present Perfect (negative: haven’t + past participle)."}]},
"He opened the envelope and began to read aloud. “My dear Tom, if you find this, I am sorry. On the night of the storm, while I ___ the lamp, I saw somebody in the dark behind me. It was Mr Harlan from the harbour council. He had turned the lamp off on purpose, so that a boat would hit the rocks and he could steal its cargo. I wrote everything in the black logbook, but he saw me. I knew that if I stayed, he would hurt you and our baby. So I took the boat to the island, and from there I left. Please don’t be angry with me. I am alive, and I promise I will…” The letter ended there, as if somebody had stopped writing in a hurry.",
{q:[{t:"“While I ___ the lamp, I saw somebody in the dark behind me.”",o:["repaired","was repairing","have repaired","repair"],a:1,w:"A longer action was in progress in the past (repairing) when a shorter action (saw) happened. We use Past Continuous for the longer action."}]},
"Nobody said anything for a long time. Mr Crane’s eyes were full of tears. “Alive,” he repeated quietly. “She was alive.” Mia’s grandfather looked at the black logbook. “So it was Harlan,” he said. “He has been smiling at me in the street for forty years.” “Mr Harlan?” said Mia. “But he’s the mayor now!” Suddenly she understood that the man who ___ the lamp that night was the most powerful person in the town.",
{q:[{t:"She understood that the man who ___ the lamp that night was now the mayor.",o:["turns off","had turned off","was turning off","will turn off"],a:1,w:"The action happened before another past moment (Mia’s understanding). We use Past Perfect: had + past participle."}]},
"Far away, they heard the sound of an engine. Then, very slowly, somebody started to walk towards the entrance."],s:[[{t:"Anna wrote that Mr Harlan came from the harbour council.",a:1,w:"Correct: she wrote it in the letter."},{t:"Mr Harlan turned the lamp off by accident.",a:0,w:"He turned it off on purpose, to steal the cargo."},{t:"Anna left on a boat to the island.",a:1,w:"Correct: she took the boat and then left from there."},{t:"Tom had often seen Anna’s handwriting in recent years.",a:0,w:"He hadn’t seen her handwriting for forty years."},{t:"Mr Harlan is the mayor now.",a:1,w:"Correct: Mia says “he’s the mayor now”."}],[{t:"Behind the wall there was a logbook, a brass key and an envelope.",a:1,w:"Correct: they were wrapped in an oilskin cloth."},{t:"The envelope was addressed to Mia.",a:0,w:"It had one word on it: “Tom”."},{t:"In the letter Anna said that she was dead.",a:0,w:"She wrote: “I am alive.”"},{t:"The letter was finished carefully.",a:0,w:"It ended suddenly, as if somebody had stopped writing in a hurry."},{t:"The people in the room heard an engine in the distance.",a:1,w:"Correct: the engine sound came from far away."}]],c:[{l:"Hide the logbook and the letter behind the wall again.",n:"p6",g:"hide"},{l:"Wait for the visitor with the logbook in your hands.",n:"p6",g:"face"}]},
p6:{title:"Chapter 6: The Mayor",b:[
{o:"hide",t:"Mia quickly put the logbook, the letter and the brass key back into the space behind the wall and pushed the stone. The wall closed with a soft noise. Only the empty tin box was left on the desk."},
{o:"face",t:"Mia held the black logbook tightly against her chest. “If he wants it,” she said, “he will have to ask me.” Her grandfather stood next to her, and Mr Crane stood in front of both of them."},
"The visitor stopped at the entrance. It was Mr Harlan, the mayor, in a long grey coat. He was older than Mia had expected, with white hair and tired eyes. “Good evening, Tom,” he said politely. “Hello, Crane. Your granddaughter always ___ too many questions, Tom. In this town, that is dangerous.”",
{q:[{t:"“Your granddaughter always ___ too many questions.”",o:["ask","asks","is asking","asked"],a:1,w:"This is a habit (always), so we use Present Simple. With she/he/it we add -s: asks."}]},
"“Why are you here?” asked Mia’s grandfather. “You know why,” said Harlan. “If you give me what you found, I ___ you leave in peace.” Mr Crane stepped forward. “You can’t stop us from ___ the truth,” he said.",
{q:[{t:"“If you give me what you found, I ___ you leave in peace.”",o:["let","will let","would let","have let"],a:1,w:"This is the first conditional (a real future possibility): if + Present Simple, will + verb."},{t:"“You can’t stop us from ___ the truth.”",o:["telling","to tell","tell","told"],a:0,w:"After a preposition (from) we use the gerund: from telling."}]},
"Mr Harlan said nothing for a long moment. Then he sat down on the old chair and took off his gloves. “Forty years ago, I was a young man with big debts,” he said. “That night, I ___ a terrible decision.”",
{q:[{t:"“That night, I ___ a terrible decision.”",o:["make","made","have made","was making"],a:1,w:"This is a finished action at a definite time in the past (that night), so we use Past Simple."}]},
"“I only wanted the cargo, not the crew. All the sailors survived, but I have never slept well since. Every night I see the dark lamp.” His voice was shaking. “If I ___ a different man, I would give you the book and ask for forgiveness. But I’m a coward, and the town thinks I’m a good mayor.”",
{q:[{t:"“If I ___ a different man, I would give you the book.”",o:["am","was being","were","would be"],a:2,w:"This is the second conditional (an imagined situation): if + Past Simple, would + verb. Here we use “were”."}]},
"He put his hand into his coat pocket. For a second Mia thought he had a weapon, but he took out a small white postcard. “One more thing,” he said. “Every year, on the day of the storm, I receive one of these. There is no name, only a picture of the lighthouse.” He turned it over and put it on the desk. “This one came yesterday.”"],s:[[{t:"Mr Harlan said he had big debts forty years ago.",a:1,w:"Correct: he was a young man with big debts."},{t:"Mr Harlan wanted to hurt the crew.",a:0,w:"He only wanted the cargo, not the crew."},{t:"All the sailors survived.",a:1,w:"Correct: Harlan said so himself."},{t:"Mr Harlan said he sleeps well every night.",a:0,w:"He said he has never slept well since that night."},{t:"He took a postcard out of his coat pocket.",a:1,w:"Correct: it was a small white postcard."}],[{t:"Mr Harlan was wearing a long grey coat.",a:1,w:"Correct: this is how Mia saw him in the doorway."},{t:"Mr Harlan said he was a brave man.",a:0,w:"He called himself a coward."},{t:"The postcard had a picture of the lighthouse.",a:1,w:"Correct: there was no name, only the picture."},{t:"He receives a postcard every year on the day of the storm.",a:1,w:"Correct: one comes every year on that day."},{t:"The postcard had a name on it.",a:0,w:"There was no name on it."}]],c:[{l:"Turn the postcard over and read the stamp.",n:"p7",g:"stamp"},{l:"Ask Mr Harlan to help you find Anna.",n:"p7",g:"help"}]},
p7:{title:"Chapter 7: The Postmark",b:[
{o:"stamp",t:"Mia picked up the postcard and looked carefully at the round stamp in the corner. The letters were faint, but with her torch she could read them: “Skerry Island, Post Office”."},
{o:"help",t:"“Mr Harlan,” said Mia slowly, “if you want to be forgiven, you can start by helping us.” The old man looked at her for a long time, then pushed the postcard across the desk. “Look at the stamp,” he said. “I have never shown it to anybody.” Mia read it with her torch: “Skerry Island, Post Office”."},
"“Skerry Island,” said Mr Crane. “That’s the big island behind the fog, two hours away by boat. I always thought it was empty.” Mr Harlan shook his head. “That’s impossible,” he said. “The Skerry post office ___ since 2006. I read about it in the council papers.”",
{q:[{t:"“The Skerry post office ___ since 2006.”",o:["closes","has been closed","was closing","closed"],a:1,w:"The situation started in the past (2006) and is still true now. With since we use Present Perfect: has been closed."}]},
"Everybody looked at the postcard again. The date on it was yesterday’s. “So somebody ___ the old stamp for twenty years,” said Mia. “Somebody who wants to be found, but only by the right people.”",
{q:[{t:"“So somebody ___ the old stamp for twenty years.”",o:["uses","is using","has been using","used"],a:2,w:"The action started in the past and continues now, with a period (for twenty years). We use Present Perfect Continuous."}]},
"Mr Harlan stood up. “I want to go with you,” he said. Mr Crane refused ___ in the same boat with the man who had destroyed his family. In the end, they agreed on a plan: Mia, her grandfather and Mr Crane would sail at dawn, and Mr Harlan would stay in town and say nothing to anybody. Outside, the wind was getting stronger. Mia’s grandfather looked at the sky with worry. “If the wind ___ from the north, boats can’t leave the harbour,” he said. “Let’s hope it changes before morning.”",
{q:[{t:"Mr Crane refused ___ in the same boat with Mr Harlan.",o:["going","to go","go","went"],a:1,w:"After the verb “refuse” we use the to-infinitive."},{t:"“If the wind ___ from the north, boats can’t leave the harbour.”",o:["blows","will blow","would blow","blew"],a:0,w:"This is a general fact, so we use the zero conditional: if + Present Simple, Present Simple."}]},
"That night Mia could not sleep. She lay in her grandfather’s old house and listened to the sea. Somewhere out there, behind the fog, there was a woman who had written the same message for forty years. At dawn, Mia ran to the harbour. The wind had not changed. All the boats were staying in port, except one: Mr Harlan’s white motorboat was leaving the harbour. And Mr Harlan himself was standing on its deck, looking straight at her."],s:[[{t:"The stamp on the postcard said Skerry Island.",a:1,w:"Correct: the stamp said “Skerry Island, Post Office”."},{t:"Skerry is a small island close to the harbour.",a:0,w:"It is a big island behind the fog, two hours away by boat."},{t:"Mr Harlan said the Skerry post office had been closed since 2006.",a:1,w:"Correct: he read about it in the council papers."},{t:"Mr Crane agreed to sail in the same boat with Mr Harlan.",a:0,w:"He refused to go in the same boat with him."},{t:"The postcard had yesterday’s date.",a:1,w:"Correct: the date on it was yesterday’s."}],[{t:"Mia said somebody wanted to be found, but only by the right people.",a:1,w:"Correct: she said it about the person who sent the postcards."},{t:"They planned to sail at dawn.",a:1,w:"Correct: Mia, Tom and Mr Crane were going to sail at dawn."},{t:"Mr Harlan was going to sail with them.",a:0,w:"He was going to stay in town and say nothing."},{t:"At dawn the wind had changed.",a:0,w:"The wind had not changed, so boats stayed in port."},{t:"Mr Harlan’s white motorboat was leaving the harbour.",a:1,w:"Correct: it was the only boat that left."}]],c:[{l:"Shout to Mr Harlan and ask him to stop.",n:"p8",g:"shout"},{l:"Ask old Mr Bell, a fisherman, to take you.",n:"p8",g:"bell"}]},
p8:{title:"Chapter 8: The Island in the Fog",b:[
{o:"shout",t:"“Mr Harlan!” shouted Mia, running to the end of the pier. “Stop!” The man on the white boat didn’t answer. He only lifted one hand, as if he wanted to say goodbye, and the boat disappeared into the grey fog. Mia’s grandfather put his hand on her shoulder. “We need another boat,” he said."},
{o:"bell",t:"Mia ran along the pier until she found old Mr Bell, a fisherman who had known her grandfather for fifty years. He was drinking tea on the deck of his green boat. “Skerry Island?” he said. “Nobody goes there in this wind. But for Tom, I’ll do it.”"},
"An hour later the green boat was moving through the fog with its small engine making a tired noise. Mia, her grandfather and Mr Crane stood at the front and watched the water. Mr Bell told them that Skerry Island had been a busy fishing village before the great storm, and that after that night nearly everybody had moved away. The boat ___ slowly through the grey water when Mia suddenly saw a pale light ahead of them.",
{q:[{t:"The boat ___ slowly through the water when Mia suddenly saw a light.",o:["moved","was moving","has moved","moves"],a:1,w:"A longer action was in progress in the past (moving) when a shorter action (saw) interrupted it. We use Past Continuous."}]},
"“Don’t worry,” said Mr Bell. “I think we ___ there in twenty minutes. The fog is lifting.” He was right. Soon a long dark line of rocks appeared out of the white, and behind it a green hill with a few small houses. At the end of an old wooden pier, Mr Harlan’s white motorboat was tied to a post. It was empty.",
{q:[{t:"“I think we ___ there in twenty minutes.”",o:["are","will be","were","have been"],a:1,w:"This is a prediction or an opinion about the future (I think…), so we use Future Simple: will + verb."}]},
"They climbed onto the pier and walked up to the village. The windows were broken, the gardens were full of tall weeds, and the street was silent. At the end of the street Mr Crane stopped in front of a small building with a faded sign: POST OFFICE. He put his hand on one of the stones next to the door. “Look,” he said. “Somebody ___ a fire here recently. The stones are still warm.”",
{q:[{t:"“Somebody ___ a fire here recently. The stones are still warm.”",o:["made","has made","was making","makes"],a:1,w:"We see a present result (the stones are still warm) of a recent action, so we use Present Perfect."}]},
"Mia’s grandfather looked at his watch and shook his head. “If we had left an hour earlier, we ___ Harlan,” he said bitterly.",
{q:[{t:"“If we had left an hour earlier, we ___ Harlan.”",o:["will catch","would catch","would have caught","caught"],a:2,w:"This is the third conditional (an unreal past situation): if + Past Perfect, would have + past participle."}]},
"Mia pushed the door of the post office. It opened without a sound. Inside, on a dusty counter, stood a small table with four cups of tea. The tea was still hot, and steam was rising from every cup. Next to the cups there was a white envelope. On it Mia read: “For Tom, Mia and Mr Crane.” She opened it with trembling fingers. There was only one sentence inside: “I have been waiting for you for forty years. Come to the north beach. – A.”"],s:[[{t:"Skerry Island had been a busy fishing village before the storm.",a:1,w:"Correct: Mr Bell said so, and that after that night nearly everybody had moved away."},{t:"Mr Harlan’s motorboat was empty at the pier.",a:1,w:"Correct: it was tied to a post and nobody was in it."},{t:"The windows of the village houses were all new.",a:0,w:"The windows were broken."},{t:"Mr Crane found a cold fire next to the post office.",a:0,w:"The stones were still warm, so the fire was recent."},{t:"The note told them to come to the north beach.",a:1,w:"Correct: “Come to the north beach.”"}],[{t:"The sign on the building said POST OFFICE.",a:1,w:"Correct: it was a faded sign."},{t:"There were two cups of tea on the table.",a:0,w:"There were four cups."},{t:"The tea in the cups was cold.",a:0,w:"It was still hot and steam was rising."},{t:"The envelope was for Tom, Mia and Mr Crane.",a:1,w:"Correct: their names were written on it."},{t:"The note was signed with the letter A.",a:1,w:"Correct: it was signed “A.”"}]],c:[{l:"Go to the north beach together.",n:"p9",g:"together"},{l:"Send Mr Crane ahead to check if it is safe.",n:"p9",g:"ahead"}]},
p9:{title:"Chapter 9: The North Beach",b:[
{o:"together",t:"They left the village together and followed a narrow path across the hill. Nobody spoke. The only sounds were their footsteps and the cry of the gulls above them."},
{o:"ahead",t:"Mr Crane went first. He walked quietly along the narrow path while the others waited behind a rock. After five minutes he raised his hand: it was safe. They followed him slowly, with their hearts beating fast."},
"The north beach was a half-moon of white sand with black rocks at both ends. At the water’s edge, a small woman in a blue coat was sitting on an old overturned boat. Her hair was grey and her face was lined, but when she turned her head, Mia’s grandfather stopped as if he had hit a wall. “Anna,” he said, in a voice that was almost silent. Next to her, at a respectful distance, Mr Harlan was standing with his hat in his hands.",
"For a long time nobody moved. Then Anna stood up, walked slowly across the sand and put her arms around Tom. Mr Crane covered his face with his hands. When Anna finally looked at Mia, she smiled through her tears. “You ___ exactly like Clara,” she said.",
{q:[{t:"“You ___ exactly like Clara,” she said.",o:["look","are looking","looked","have looked"],a:0,w:"Look (meaning “appear / seem”) is a state verb. We use state verbs in Present Simple, not in Continuous."}]},
"“I want to explain everything,” said Anna. “After the storm, Harlan’s men were looking for me. I was hurt, and an old fisherman hid me in his house on Skerry. When I was strong again, Harlan had become an important man. I knew that if I came home, he would put you and Clara in danger. So I stayed here. I spent forty years ___ for the right moment. And every year I sent one postcard, so that he never forgot.”",
{q:[{t:"“If I ___ home, Harlan would put you and Clara in danger.”",o:["come","came","had come","would come"],a:1,w:"This is the second conditional (an imagined situation): if + Past Simple, would + verb."},{t:"“I spent forty years ___ for the right moment.”",o:["wait","waiting","to wait","waited"],a:1,w:"After “spend time” we use the gerund (verb + -ing)."}]},
"Mr Harlan stepped forward. His face was grey. “Anna,” he said, “I didn’t come to take anything from you. I came to say that I am sorry. Yesterday’s postcard changed something in me. I ___ the whole truth to the town tomorrow, if you want me to.” Nobody answered. Mr Crane looked at him with cold eyes, but he did not say a word.",
{q:[{t:"“I ___ the whole truth to the town tomorrow, if you want me to.”",o:["tell","am telling","will tell","have told"],a:2,w:"This is a spontaneous offer or promise about the future, so we use Future Simple: will + verb."}]},
"Anna turned back to Mia. “You found my notebook, didn’t you?” she said. Mia nodded. “Then you need this.” She took a folded piece of old paper out of her coat pocket and gave it to Mia. It was the torn page. Mia unfolded it with trembling hands and read the first line aloud: “The real treasure is not gold. It is…” She stopped. The next word was not what anybody expected."],s:[[{t:"Anna was sitting on an overturned boat.",a:1,w:"Correct: she was sitting at the water’s edge on an old overturned boat."},{t:"Anna’s hair was black.",a:0,w:"Her hair was grey."},{t:"Mr Harlan came to the beach to take something from Anna.",a:0,w:"He said he didn’t come to take anything, only to say sorry."},{t:"Anna sent one postcard every year.",a:1,w:"Correct: so that Harlan never forgot."},{t:"Anna gave Mia the torn page.",a:1,w:"Correct: it was the page that was missing from the notebook."}],[{t:"A fisherman hid Anna in his house on Skerry.",a:1,w:"Correct: she was hurt and he helped her."},{t:"Anna was strong and healthy after the storm.",a:0,w:"She was hurt after the storm."},{t:"Anna said that Mia looked exactly like Clara.",a:1,w:"Correct: Clara is Mia’s mother."},{t:"Mr Harlan promised to tell the truth to the town the next day.",a:1,w:"Correct: he said he would tell the whole truth tomorrow."},{t:"Mr Crane forgave Mr Harlan immediately.",a:0,w:"He looked at him with cold eyes and said nothing."}]],c:[{l:"Read the next word aloud yourself.",n:"p10",g:"read"},{l:"Give the page to Tom to read first.",n:"p10",g:"tom"}]},
p10:{title:"Chapter 10: The Storm Returns",b:[
{o:"read",t:"Mia took a deep breath and read the next word aloud. “Clara,” she said. “The real treasure is Clara.” Her voice broke."},
{o:"tom",t:"Mia passed the page to her grandfather. He held it close to his eyes. His lips moved silently, and then he said it aloud in a rough voice: “Clara. The real treasure is Clara.”"},
"Anna put her hand over her mouth. “I wrote that page the night before the storm,” she said. “I was sitting at the little desk, looking at our sleeping baby. I wasn’t afraid of anything. And then everything changed.” Nobody wanted to leave the beach, but the sky was turning dark and the sea was growing restless. Mr Crane looked at the clouds. “We have to go back now,” he said. “If we wait too long, we ___ able to cross at all.”",
{q:[{t:"“If we wait too long, we ___ able to cross at all.”",o:["aren’t","won’t be","wouldn’t be","hadn’t been"],a:1,w:"This is the first conditional (a real future possibility): if + Present Simple, will + verb. The negative of will is won’t."}]},
"They left the island in Mr Bell’s green boat, and Mr Harlan followed them in his white motorboat. At first the sea was only rough. Then the wind became stronger, big waves began to hit the boat, and the fog came back. Anna held Tom’s hand tightly. She was shaking. Suddenly the engine coughed twice and stopped. Mr Bell looked at it in surprise. He ___ it carefully before they left, so he could not understand what was wrong.",
{q:[{t:"Mr Bell ___ the engine carefully before they left.",o:["checks","had checked","has checked","was checking"],a:1,w:"The checking happened before another past moment (the engine stopping). We use Past Perfect: had + past participle."}]},
"He tried ___ it again and again, but nothing happened. The green boat began to turn slowly in the waves. Mr Crane held a rope with both hands, and Mia could see the white boat of Mr Harlan far behind them, jumping on the water like a toy. Everybody was silent. Everybody was thinking about the night forty years ago.",
{q:[{t:"Mr Bell tried ___ the engine again and again.",o:["to start","starting","start","started"],a:0,w:"Try + to-infinitive means “make an effort to do something that is difficult”. (Try + -ing means “do it as an experiment”.)"}]},
"Then, far ahead, a bright light appeared in the darkness. It was round and strong and white, and it moved slowly across the water, like a hand showing the way. “The lighthouse!” cried Mia’s grandfather. “Somebody ___ the lamp!”",
{q:[{t:"“Somebody ___ the lamp!” (we can see the light now)",o:["lights","has lit","was lighting","will light"],a:1,w:"We see a present result (the light is on) of a recent action, so we use Present Perfect: has lit."}]},
"For the first time in forty years, the lamp of the Port Selby lighthouse was shining over the sea. The beam showed Mr Bell where the rocks were, and he began to row with a long oar towards the harbour. Mia looked at the high tower and asked herself one question: who was standing next to the lamp?"],s:[[{t:"Mia wrote the torn page.",a:0,w:"Anna wrote it, the night before the storm."},{t:"Anna wrote the page the night before the storm.",a:1,w:"Correct: she was looking at her sleeping baby."},{t:"The real treasure was gold.",a:0,w:"The real treasure was Clara, not gold."},{t:"The engine of the green boat stopped.",a:1,w:"Correct: it coughed twice and stopped."},{t:"They left the island in Mr Bell’s green boat.",a:1,w:"Correct: Mr Harlan followed in his white motorboat."}],[{t:"Mr Harlan followed them in a white motorboat.",a:1,w:"Correct: it was jumping on the water behind them."},{t:"Mr Bell hadn’t checked the engine before they left.",a:0,w:"He had checked it carefully, so he was surprised."},{t:"A bright light appeared far ahead in the darkness.",a:1,w:"Correct: it was the lamp of the lighthouse."},{t:"The lamp was lit for the first time in forty years.",a:1,w:"Correct: it was shining over the sea again."},{t:"Mia knew who lit the lamp.",a:0,w:"She only asked herself who was standing next to the lamp."}]],c:[{l:"Row towards the light of the lighthouse.",n:"p11",g:"row"},{l:"Signal with a torch for Mr Harlan to follow.",n:"p11",g:"signal"}]},
p11:{title:"Chapter 11: The Lamp Is Lit",b:[
{o:"row",t:"Mr Bell took the long oar again, and Mr Crane took the second one. Together they began to row towards the beam. Their arms hurt, but the light was getting bigger with every stroke."},
{o:"signal",t:"Mia took her torch from her bag and waved it in a wide circle towards the white boat behind them. After a minute, a small light answered from the dark: Mr Harlan understood. Then Mr Bell and Mr Crane began to row together towards the beam."},
"It took them half an hour to reach the harbour. When the green boat finally touched the pier, Mia saw hundreds of lamps and torches along the wall. The whole town was standing there in the rain, and nobody was talking. Mrs Bell, a tall woman in a yellow raincoat, ran to the edge of the pier. “Tom! Thank God!” she shouted. “I ___ the radio message from my husband an hour ago, and I called everybody.”",
{q:[{t:"“I ___ the radio message from my husband an hour ago.”",o:["got","have got","was getting","get"],a:0,w:"This is a finished action at a definite time in the past (an hour ago), so we use Past Simple."}]},
"“But who lit the lamp?” asked Mia. Mrs Bell smiled and pointed at the tower. “We did,” she said. “Twenty men and women broke the old door and started the generator. The truth is that nobody in this town ever believed the story about the storm. We couldn’t help ___ about that night. But Harlan was powerful, and everybody was afraid. Tonight, when we heard the wind, we remembered Anna, and we decided to stop being afraid.”",
{q:[{t:"“We couldn’t help ___ about that night.”",o:["to think","thinking","think","thought"],a:1,w:"After can’t help we use the gerund (verb + -ing): can’t help thinking = we can’t stop ourselves from thinking."}]},
"Anna was standing behind Tom and was crying quietly. Mrs Bell looked at her for a long time and then took both her hands. “Welcome home, Anna,” she said. Then she turned to the crowd. “If people stand together, fear ___ smaller,” she said in a loud voice. “And tonight we are standing together.”",
{q:[{t:"“If people stand together, fear ___ smaller.”",o:["gets","will get","would get","got"],a:0,w:"This is a general truth, so we use the zero conditional: if + Present Simple, Present Simple."}]},
"A few minutes later the white motorboat arrived. Mr Harlan climbed slowly onto the pier, wet and tired, without his hat. The crowd moved back and became completely silent. Hundreds of eyes looked at the mayor. Somebody at the back shouted, “Mr Mayor, where have you been all day?” Mr Harlan looked at the faces around him, at the lamp shining above them, and at Anna. He took one step forward. “I am not going to wait until tomorrow,” he said."],s:[[{t:"Mrs Bell was wearing a yellow raincoat.",a:1,w:"Correct: she was a tall woman in a yellow raincoat."},{t:"Mrs Bell got a radio message from her husband.",a:1,w:"Correct: she got it an hour before and called everybody."},{t:"Only five people lit the lamp.",a:0,w:"Twenty men and women broke the door and started the generator."},{t:"Mrs Bell said that nobody believed the story about the storm.",a:1,w:"Correct: the town never believed it, but everybody was afraid."},{t:"Mr Harlan arrived in the green boat.",a:0,w:"He arrived in his white motorboat."}],[{t:"The people had broken the old door of the tower.",a:1,w:"Correct: they did it to reach the lamp."},{t:"Mrs Bell said that fear gets bigger when people stand together.",a:0,w:"She said fear gets smaller when people stand together."},{t:"The town was afraid of Mr Harlan because he was powerful.",a:1,w:"Correct: Harlan was powerful, so everybody was afraid."},{t:"Mr Harlan arrived wearing his hat.",a:0,w:"He arrived without his hat."},{t:"Mr Harlan said he would wait until tomorrow.",a:0,w:"He said: “I am not going to wait until tomorrow.”"}]],c:[{l:"Put the logbook on a table where everyone can see it.",n:"p12",g:"logbook"},{l:"Ask the crowd to listen quietly to Mr Harlan.",n:"p12",g:"listen"}]},
p12:{title:"Chapter 12: The Mayor Speaks",b:[
{o:"logbook",t:"Tom took the black logbook from inside his coat, where he had carried it since the morning, and put it on an empty fish box in the middle of the pier. Mrs Bell held an umbrella over it. Everybody could see the old black cover."},
{o:"listen",t:"Tom raised his hand. “Please,” he said, “let him speak. Everybody here has waited for this for forty years.” The rain was falling harder, but nobody moved."},
"Mr Harlan took a deep breath. “For forty years I ___ a lie,” he said. “I told you that the lamp stopped working because of the storm. It was not true.” A murmur went through the crowd.",
{q:[{t:"“For forty years I ___ a lie,” he said.",o:["live","have been living","was living","lived"],a:1,w:"The situation started in the past and continues until now, with a period (for forty years). We use Present Perfect Continuous."}]},
"“I turned off that lamp with my own hands. I was young, I had big debts, and I made a terrible choice. A fishing boat hit the rocks. Nobody died, but three men were badly hurt, and one of them, Old Pete, never walked again. If I ___ the truth that night, he would have received help, and so would his family.”",
{q:[{t:"“If I ___ the truth that night, he would have received help.”",o:["told","had told","would tell","tell"],a:1,w:"This is the third conditional (an unreal past situation): if + Past Perfect, would have + past participle."}]},
"“Instead, I used the cargo money to start my career. Year after year I won elections, and year after year I was afraid of ___ the truth. I looked at the dark lighthouse every morning and told myself that nobody would ever find out.” He looked at the old lamp shining above them. “Tonight, for the first time, I am glad that I was wrong.”",
{q:[{t:"“I was afraid of ___ the truth.”",o:["tell","to tell","telling","told"],a:2,w:"After a preposition (of) we use the gerund (verb + -ing)."}]},
"Then he turned to Anna. “Anna, you sent me one postcard every year, and every year I hated you for it. Now I understand that you gave me forty chances to speak, and I refused them all. I will write my resignation tonight. I will give the council every paper I have, and I will say the same words to the police.” He lowered his head. “That is all.”",
"For a few seconds nobody said anything. Only the rain made a sound on the stones of the pier. Then, in the middle of the crowd, something moved. People stepped back and made a narrow path. A young woman was slowly pushing a wheelchair, and in the wheelchair sat a thin old man with a blanket over his knees. Mr Harlan’s face turned white. “Pete,” he whispered."],s:[[{t:"Mr Harlan said that he turned off the lamp himself.",a:1,w:"Correct: “I turned off that lamp with my own hands.”"},{t:"Nobody was hurt in the accident.",a:0,w:"Three men were badly hurt."},{t:"Old Pete never walked again.",a:1,w:"Correct: he was one of the three hurt men."},{t:"Mr Harlan used the cargo money to start his career.",a:1,w:"Correct: he won elections year after year."},{t:"Mr Harlan said he would write his resignation.",a:1,w:"Correct: he promised to write it that night."}],[{t:"Mr Harlan said the lamp stopped because of the storm.",a:0,w:"That was the lie he told for forty years. He turned it off on purpose."},{t:"Every year, when the postcard came, Mr Harlan hated Anna for it.",a:1,w:"Correct: now he understands it gave him forty chances."},{t:"Mr Harlan promised to give the council all his papers.",a:1,w:"Correct: he also promised to speak to the police."},{t:"The person in the wheelchair was Mrs Bell.",a:0,w:"It was a thin old man, Pete, pushed by a young woman."},{t:"Mr Harlan’s face turned white when he saw Pete.",a:1,w:"Correct: he whispered Pete’s name."}]],c:[{l:"Let Old Pete speak first.",n:"p13",g:"pete"},{l:"Let Mr Harlan walk to Pete and speak first.",n:"p13",g:"harlan"}]},
p13:{title:"Chapter 13: Old Pete",b:[
{o:"pete",t:"Nobody moved. Mia looked at the old man in the wheelchair. His face was lined and his hands were rough from years of work with nets. “Let me speak first,” said Pete, in a quiet but clear voice, and the whole pier became silent."},
{o:"harlan",t:"Mr Harlan walked slowly across the wet stones until he stood in front of the wheelchair. He took off his coat, dropped it on the ground and knelt in the rain. “Pete,” he said. “I have no right to ask for anything.” Pete looked down at him for a long moment. Then he said, in a quiet but clear voice, “Stand up. And listen.”"},
"“I always suspected,” said Pete. “The lamp had worked perfectly all that week. I ___ nets with my brother on the pier when the beam suddenly went out. I shouted, but nobody listened to a poor fisherman. And then the rocks took the boat.” A murmur ran through the crowd. Pete’s granddaughter put a hand on his shoulder.",
{q:[{t:"“I ___ nets with my brother when the beam suddenly went out.”",o:["repaired","was repairing","have repaired","repair"],a:1,w:"A longer action was in progress in the past (repairing) when another action (the beam went out) happened. We use Past Continuous."}]},
"“For many years I was very angry,” continued Pete. “I wanted to see you in prison, Harlan. But I learned something at the end of my life. Anger is like a heavy net. If you carry it too long, it ___ you down. I am tired of ___ angry. I am an old man, and I want to see this town become a good place again.”",
{q:[{t:"“If you carry anger too long, it ___ you down.”",o:["pulls","will pull","would pull","pulled"],a:0,w:"This is a general truth, so we use the zero conditional: if + Present Simple, Present Simple."},{t:"“I am tired of ___ angry.”",o:["to be","being","be","been"],a:1,w:"After the adjective + preposition (tired of) we use the gerund: being."}]},
"Mr Harlan could not speak. Tears were running down his face. “The police will decide about your punishment,” said Pete, “and the town will decide about your future. But I will tell you what I want from you. I want you ___ the lamp burning, every night, for the rest of your life. Not as a mayor. As a keeper.”",
{q:[{t:"“I want you ___ the lamp burning every night.”",o:["keep","to keep","keeping","kept"],a:1,w:"After want + object (want you) we use the to-infinitive: want somebody to do something."}]},
"For a long moment the only sound was the rain. Then Mr Harlan nodded. “I ___ it burning,” he said hoarsely. “Every night, Pete. I promise.”",

let P,n,id,qi,trail=[];const app=document.getElementById("app");
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e}
function start(){P=structuredClone(P0);trail=[];n=1;id="p1";qi=0;read()}
function read(){app.innerHTML="";const p=P[id];app.append(h("div","tag","Reader "+n+" of 15"),h("h2","",p.title));
for(const b of p.b){if(b.o){if(trail.includes(b.o))app.append(h("p","",b.t));continue}if(typeof b==="string"){app.append(h("p","",b));continue}
if(b.k===undefined)b.k=0;if(b.k<b.q.length){gate(b);return}}
const bx=h("div","box");
if(p.c){const t=h("button","p","Next reader: answer the quiz");t.onclick=quiz;bx.append(h("div","","Reader "+(n+1)+" must pass the quiz to choose what happens next."),t)}
else bx.append("The End (for now).");
const r=h("button","","Restart");r.onclick=start;bx.append(h("div","m"),r);app.append(bx)}
function gate(g){const q=g.q[g.k],bx=h("div","box");bx.append(h("div","tag","Grammar check – you can’t continue until you answer correctly"),h("p","",q.t));
const msg=h("div","m");
q.o.forEach((o,i)=>{const b=h("button","",o);b.onclick=()=>{if(i===q.a){g.k++;read()}else{b.disabled=true;msg.innerHTML="<span class='no'>✗ Not correct.</span> Why: "+q.w.replace(/^/,"")+" Try again."}};bx.append(b)});
bx.append(msg);app.append(bx);bx.scrollIntoView({block:"center"})}
function quiz(){app.innerHTML="";const p=P[id],set=p.s[qi%p.s.length],sel=[];
app.append(h("div","tag","Reader "+(n+1)+" of 15 – Quiz"),h("h2","","True or False?"),h("p","","Answer correctly at least 3 of 5 to choose the next step."));
set.forEach((q,i)=>{const bx=h("div","box");bx.append(h("div","",(i+1)+". "+q.t));
const t=h("button","","True"),f=h("button","","False");
const pick=v=>{sel[i]=v;t.classList.toggle("p",v===1);f.classList.toggle("p",v===0)};
t.onclick=()=>pick(1);f.onclick=()=>pick(0);bx.append(t,f,h("div","m ex"));app.append(bx)});
const ck=h("button","p","Check answers"),res=h("div","box");res.hidden=true;
ck.onclick=()=>{if(set.some((q,i)=>sel[i]===undefined)){alert("Answer all 5 statements first.");return}
let sc=0;const ex=app.querySelectorAll(".ex");
set.forEach((q,i)=>{if(sel[i]===q.a){sc++;ex[i].innerHTML="<span class='ok'>✓ Correct.</span>"}else ex[i].innerHTML="<span class='no'>✗ Wrong.</span> Why: "+q.w});
ck.disabled=true;res.hidden=false;res.innerHTML="";
if(sc>=3){res.append(h("p","ok","Passed: "+sc+"/5. Choose what happens next:"));
p.c.forEach(c=>{const b=h("button","p",c.l);b.onclick=()=>{if(c.g)trail.push(c.g);n++;id=c.n;qi=0;read()};res.append(b,h("br"))})}
else{res.append(h("p","no","Only "+sc+"/5 – you need 3. You will get new questions."));const b=h("button","p","Try new questions");b.onclick=()=>{qi++;quiz()};res.append(b)}
res.scrollIntoView({block:"center"})};
app.append(ck,res)}
